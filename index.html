<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAREER//LOG — Football Career Database</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#090b0d;--panel:#111519;--panel2:#171d22;--line:#283139;--text:#f2f5f6;--muted:#89949d;--accent:#d9e2e7;--green:#a7c6b5;--danger:#d98b8b;--radius:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#0d1114;border-right:1px solid var(--line);padding:25px 16px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:850;letter-spacing:2px;padding:0 12px 28px}.brand span{color:#9eb8aa}.side small{color:var(--muted);display:block;padding:12px;font-size:10px;letter-spacing:1.7px;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aab4bb;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#1b2429;color:white}.nav b{font-size:16px;width:18px;text-align:center;font-weight:500}.side-foot{position:absolute;bottom:20px;left:26px;color:#66717a;font-size:11px}.main{min-width:0;padding:28px clamp(16px,3vw,44px) 60px;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.8px;text-transform:uppercase}.top h1{font-size:25px;margin:4px 0 0;letter-spacing:-.7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#151b1f;color:var(--text);padding:9px 13px;border-radius:9px;font-weight:600}.btn:hover{background:#222b31}.btn.primary{background:#e7edef;color:#101518;border-color:#e7edef}.btn.danger{color:#f1aaaa}.grid{display:grid;gap:14px}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:14px;margin-bottom:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px;min-width:0}.player{display:flex;align-items:center;gap:18px;min-height:175px}.avatar{width:88px;height:88px;border-radius:18px;background:linear-gradient(145deg,#283a34,#17211e);display:grid;place-items:center;font-size:30px;font-weight:800;color:#c4d6cc;flex-shrink:0;border:1px solid #405149}.player h2{font-size:25px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:11px;padding:4px 8px;border-radius:6px;background:#1c252a;color:#c3cdd2;border:1px solid #2c383f}.overall{margin-left:auto;text-align:center;border-left:1px solid var(--line);padding-left:22px}.overall strong{font-size:38px;display:block;line-height:1}.overall span{font-size:10px;color:var(--muted);letter-spacing:1.5px}.profile-info{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.info label,.metric label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.2px}.info strong{display:block;margin-top:3px;font-size:14px}.metrics{grid-template-columns:repeat(6,minmax(0,1fr));margin:14px 0}.metric strong{font-size:25px;display:block;letter-spacing:-1px;margin-top:5px}.metric small{color:var(--muted);font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 12px}.section-head h2{font-size:16px;margin:0}.section-head p{margin:2px 0 0;color:var(--muted);font-size:12px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.chartbox{height:260px;position:relative}.record{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.record span{color:var(--muted);font-size:12px}.record strong{font-size:13px;text-align:right}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;background:#151b1f}.table td{font-size:13px}.table tr:last-child td{border:0}.empty{padding:35px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:230px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;background:#0c1114;border:1px solid #303b43;border-radius:8px;color:var(--text);padding:10px;outline:none}input:focus,select:focus,textarea:focus{border-color:#879b90}textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.formgrid .wide{grid-column:1/-1}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.dialog{background:#11171b;border:1px solid #354149;border-radius:16px;width:min(700px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 25px 80px #0009}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialog-head h2{margin:0;font-size:18px}.close{background:none;border:0;color:#aab4bb;font-size:22px}.hidden{display:none!important}.muted{color:var(--muted)}.pill{display:inline-block;padding:3px 7px;border-radius:5px;background:#1d2924;color:#b8d1c3;font-size:10px}.timeline{border-left:1px solid #3b484f;margin:8px 0 0 8px;padding-left:22px}.event{position:relative;padding:0 0 20px}.event:before{content:"";position:absolute;left:-27px;top:5px;width:9px;height:9px;border-radius:50%;background:#b7c9bf;border:3px solid #18211e}.event strong{display:block}.event small{color:var(--muted)}.toast{position:fixed;bottom:20px;right:20px;background:#e6efea;color:#101714;padding:11px 16px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}.mobile-head{display:none}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.profile-info{grid-template-columns:repeat(4,1fr)}}
@media(max-width:720px){.app{display:block}.side{height:auto;position:relative;padding:13px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 7px 10px}.side small,.side-foot{display:none}.nav{display:flex;overflow:auto;gap:5px;padding-bottom:2px}.nav button{white-space:nowrap;padding:8px 10px;font-size:12px}.nav b{display:none}.main{padding:20px 14px 45px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:22px}.player{align-items:flex-start;flex-wrap:wrap}.avatar{width:65px;height:65px;font-size:22px}.player h2{font-size:20px}.overall{margin-left:auto;padding-left:12px}.overall strong{font-size:30px}.profile-info{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.actions{width:100%}.actions .btn{flex:1}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand">CAREER<span>//</span>LOG</div><small>Workspace</small><nav class="nav" id="nav">
<button data-page="overview" class="active"><b>◫</b> Visão geral</button><button data-page="seasons"><b>▤</b> Temporadas</button><button data-page="stats"><b>⌁</b> Estatísticas</button><button data-page="competitions"><b>◎</b> Competições</button><button data-page="titles"><b>♜</b> Títulos</button><button data-page="awards"><b>✧</b> Premiações</button><button data-page="transfers"><b>⇄</b> Transferências</button><button data-page="national"><b>⚑</b> Seleção</button><button data-page="clubs"><b>⌂</b> Clubes</button><button data-page="records"><b>★</b> Recordes</button><button data-page="timeline"><b>◷</b> Linha do tempo</button></nav><div class="side-foot">PERSONAL FOOTBALL DATABASE · v1.0</div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">Player career database / <span id="crumb">Overview</span></div><h1 id="pageTitle">Visão geral</h1></div><div class="actions"><button class="btn" onclick="openProfile()">Editar jogador</button><button class="btn primary" onclick="quickAdd()">＋ Novo registro</button></div></header><div id="content"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle">Novo registro</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank={profile:{name:'Novo jogador',nationality:'—',birth:'',position:'—',foot:'—',number:'—',club:'—',overall:0,avatar:'',height:'—'},seasons:[],competitions:[],titles:[],awards:[],transfers:[],national:[],events:[],clubs:[]};
let db=load(),page='overview',charts={};
function load(){try{return JSON.parse(localStorage.getItem('careerlog_db'))||structuredClone(blank)}catch(e){return structuredClone(blank)}}
function save(){localStorage.setItem('careerlog_db',JSON.stringify(db));render();toast('Dados salvos neste dispositivo')}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function n(v){return Number(v)||0}function sum(a,k){return a.reduce((s,x)=>s+n(x[k]),0)}function avg(a,k){return a.length?sum(a,k)/a.length:0}function fmt(x){return Number(x||0).toLocaleString('pt-BR',{maximumFractionDigits:2})}
function totalGames(){return sum(db.seasons,'games')}function totalGoals(){return sum(db.seasons,'goals')}function totalAssists(){return sum(db.seasons,'assists')}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
const titles={overview:'Visão geral',seasons:'Temporadas',stats:'Estatísticas',competitions:'Competições',titles:'Galeria de títulos',awards:'Premiações individuais',transfers:'Transferências',national:'Carreira pela seleção',clubs:'Banco de clubes',records:'Recordes pessoais',timeline:'Linha do tempo'};
function render(){ $('#pageTitle').textContent=titles[page];$('#crumb').textContent=page.toUpperCase(); Object.values(charts).forEach(c=>c.destroy());charts={}; let f={overview, seasons:seasonPage,stats:statsPage,competitions:competitionPage,titles:titlePage,awards:awardPage,transfers:transferPage,national:nationalPage,clubs:clubPage,records:recordPage,timeline:timelinePage}[page];$('#content').innerHTML=f(); if(page==='overview'||page==='stats')drawCharts();}
function metric(label,val,sub=''){return `<div class="panel metric"><label>${label}</label><strong>${val}</strong><small>${sub}</small></div>`}
function overview(){let p=db.profile,s=db.seasons,top=(k)=>s.length?[...s].sort((a,b)=>n(b[k])-n(a[k]))[0]:null;return `
<div class="hero"><section class="panel player"><div class="avatar">${esc(p.avatar||((p.name||'N').split(' ').map(x=>x[0]).slice(0,2).join('')))}</div><div><div class="eyebrow">PLAYER PROFILE</div><h2>${esc(p.name)}</h2><div class="sub">${esc(p.nationality)} · ${esc(p.position)} · ${esc(p.foot)} dominante</div><div class="tags"><span class="tag">${esc(p.club)}</span><span class="tag">Camisa ${esc(p.number)}</span><span class="tag">${s.length} temporadas</span></div></div><div class="overall"><strong>${fmt(p.overall)}</strong><span>OVERALL</span></div></section>
<section class="panel profile-info"><div class="info"><label>Nascimento</label><strong>${esc(p.birth||'—')}</strong></div><div class="info"><label>Idade</label><strong>${age(p.birth)}</strong></div><div class="info"><label>Pé dominante</label><strong>${esc(p.foot)}</strong></div><div class="info"><label>Altura</label><strong>${esc(p.height)}</strong></div></section></div>
<div class="grid metrics">${metric('Jogos',fmt(totalGames()))}${metric('Gols',fmt(totalGoals()))}${metric('Assistências',fmt(totalAssists()))}${metric('Participações',fmt(totalGoals()+totalAssists()))}${metric('Títulos',db.titles.length)}${metric('Premiações',db.awards.length)}</div>
<div class="grid two"><section class="panel"><div class="section-head"><div><h2>Desempenho por temporada</h2><p>Gols e assistências registrados</p></div></div><div class="chartbox"><canvas id="overviewChart"></canvas></div></section><section class="panel"><div class="section-head"><div><h2>Marcos da carreira</h2><p>Recordes calculados a partir dos registros</p></div></div>${recordLine('Temporada mais goleadora',top('goals'), 'goals','gols')}${recordLine('Mais assistências',top('assists'),'assists','assistências')}${recordLine('Mais jogos',top('games'),'games','jogos')}${recordLine('Mais participações',s.length?[...s].sort((a,b)=>(n(b.goals)+n(b.assists))-(n(a.goals)+n(a.assists)))[0]:null,'g+a','participações')}</section></div>
<div class="section-head"><div><h2>Últimas temporadas</h2><p>Visão rápida do histórico recente</p></div><button class="btn" onclick="setPage('seasons')">Ver todas</button></div>${seasonTable(s.slice(-5).reverse())}`;}
function age(d){if(!d)return'—';let b=new Date(d+'T00:00:00');if(isNaN(b))return'—';let t=new Date(),a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a+' anos'}
function recordLine(label,x,k,unit){return `<div class="record"><span>${label}</span><strong>${x?`${esc(x.name)} · ${fmt(k==='g+a'?n(x.goals)+n(x.assists):x[k])} ${unit}`:'—'}</strong></div>`}
function seasonTable(arr){if(!arr.length)return'<div class="panel empty">Nenhuma temporada cadastrada. Adicione seu primeiro registro para começar.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Temporada</th><th>Clube</th><th>Idade</th><th>Jogos</th><th>Gols</th><th>Assist.</th><th>G+A</th><th>Overall</th><th></th></tr></thead><tbody>${arr.map((s)=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.club)}</td><td>${esc(s.age||'—')}</td><td>${fmt(s.games)}</td><td>${fmt(s.goals)}</td><td>${fmt(s.assists)}</td><td>${fmt(n(s.goals)+n(s.assists))}</td><td>${esc(s.overallEnd||'—')}</td><td><button class="btn" onclick="editSeason('${s.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function seasonPage(){return `<div class="toolbar"><input id="seasonSearch" placeholder="Pesquisar temporada ou clube..." oninput="filterSeasons()"><button class="btn primary" onclick="seasonForm()">＋ Adicionar temporada</button></div><div id="seasonList">${seasonTable([...db.seasons].reverse())}</div>`}
function filterSeasons(){let q=$('#seasonSearch').value.toLowerCase();$('#seasonList').innerHTML=seasonTable([...db.seasons].filter(s=>(s.name+s.club).toLowerCase().includes(q)).reverse())}
function statsPage(){return `<div class="grid metrics">${metric('Média de gols / jogo',totalGames()?(totalGoals()/totalGames()).toFixed(2):'0.00')}${metric('Média de assist. / jogo',totalGames()?(totalAssists()/totalGames()).toFixed(2):'0.00')}${metric('G+A por jogo',totalGames()?((totalGoals()+totalAssists())/totalGames()).toFixed(2):'0.00')}${metric('Temporadas',db.seasons.length)}</div><div class="grid two"><section class="panel"><h2>Gols por temporada</h2><div class="chartbox"><canvas id="goalsChart"></canvas></div></section><section class="panel"><h2>Assistências por temporada</h2><div class="chartbox"><canvas id="assistsChart"></canvas></div></section><section class="panel"><h2>Jogos por temporada</h2><div class="chartbox"><canvas id="gamesChart"></canvas></div></section><section class="panel"><h2>Overall por temporada</h2><div class="chartbox"><canvas id="overallChart"></canvas></div></section></div><div class="section-head"><h2>Comparação de temporadas</h2></div>${comparisonTable()}`}
function comparisonTable(){return seasonTable(db.seasons)}
function drawCharts(){let s=db.seasons,labels=s.map(x=>x.name);let make=(id,sets)=>{let el=document.getElementById(id);if(el)charts[id]=new Chart(el,{type:'line',data:{labels,datasets:sets.map(z=>({label:z[0],data:s.map(x=>n(x[z[1]])),borderColor:z[2],backgroundColor:z[2],tension:.3,borderWidth:2,pointRadius:3}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#aab4bb'}}},scales:{x:{ticks:{color:'#89949d'},grid:{color:'#283139'}},y:{beginAtZero:true,ticks:{color:'#89949d'},grid:{color:'#283139'}}}}})};if(page==='overview')make('overviewChart',[['Gols','goals','#dce6e1'],['Assistências','assists','#91ad9e']]);if(page==='stats'){make('goalsChart',[['Gols','goals','#dce6e1']]);make('assistsChart',[['Assistências','assists','#a4bcae']]);make('gamesChart',[['Jogos','games','#dce6e1']]);make('overallChart',[['Overall inicial','overallStart','#89949d'],['Overall final','overallEnd','#c5d8cc']]);}}
function genericTable(items,cols,editFn,empty){if(!items.length)return`<div class="panel empty">${empty}</div>`;return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>${items.map(x=>`<tr>${cols.map(c=>`<td>${esc(x[c[1]]||'—')}</td>`).join('')}<td><button class="btn" onclick="${editFn}('${x.id}')">Editar</button> <button class="btn danger" onclick="removeItem('${editFn}','${x.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}
function competitionPage(){return `<div class="toolbar"><button class="btn primary" onclick="simpleForm('competitions','Competição',[['name','Nome'],['season','Temporada'],['country','País/continente'],['type','Tipo'],['team','Clube/seleção'],['games','Jogos','number'],['goals','Gols','number'],['assists','Assistências','number'],['finish','Colocação final'],['notes','Observações','textarea']])">＋ Nova competição</button></div>${genericTable(db.competitions,[['Competição','name'],['Temporada','season'],['Tipo','type'],['Equipe','team'],['Jogos','games'],['Gols','goals'],['Assist.','assists']],'editCompetition','Nenhuma competição cadastrada.')}`}
function titlePage(){return `<div class="grid metrics">${metric('Total de títulos',db.titles.length)}${metric('Ligas',db.titles.filter(x=>x.category==='Liga nacional').length)}${metric('Copas',db.titles.filter(x=>x.category==='Copa nacional').length)}${metric('Internacionais',db.titles.filter(x=>/continental|mundial/i.test(x.category||'')).length)}</div><div class="toolbar"><button class="btn primary" onclick="simpleForm('titles','Título',[['name','Nome do título'],['season','Temporada'],['team','Clube/seleção'],['competition','Competição'],['category','Categoria','select','Liga nacional|Copa nacional|Continental|Mundial|Seleções|Supercopa|Outro'],['quantity','Quantidade','number'],['notes','Observações','textarea']])">＋ Registrar título</button></div>${genericTable(db.titles,[['Título','name'],['Temporada','season'],['Clube/seleção','team'],['Categoria','category'],['Competição','competition']],'editTitle','Sua galeria de conquistas está vazia.')}`}
function awardPage(){return `<div class="toolbar"><button class="btn primary" onclick="simpleForm('awards','Premiação',[['name','Nome do prêmio'],['season','Temporada'],['entity','Entidade responsável'],['notes','Observações','textarea']])">＋ Nova premiação</button></div>${genericTable(db.awards,[['Premiação','name'],['Temporada','season'],['Entidade','entity']],'editAward','Nenhuma premiação cadastrada.')}`}
function transferPage(){return `<div class="toolbar"><button class="btn primary" onclick="simpleForm('transfers','Transferência',[['from','Clube de origem'],['to','Clube de destino'],['season','Temporada'],['age','Idade','number'],['value','Valor'],['overall','Overall','number'],['type','Tipo'],['notes','Observações','textarea']])">＋ Nova transferência</button></div>${genericTable(db.transfers,[['Origem','from'],['Destino','to'],['Temporada','season'],['Idade','age'],['Valor','value'],['Overall','overall']],'editTransfer','Nenhuma transferência registrada.')}`}
function nationalPage(){return `<div class="grid metrics">${metric('Jogos',sum(db.national,'games'))}${metric('Gols',sum(db.national,'goals'))}${metric('Assistências',sum(db.national,'assists'))}${metric('Títulos',db.national.reduce((a,x)=>a+n(x.titles),0))}</div><div class="toolbar"><button class="btn primary" onclick="simpleForm('national','Registro pela seleção',[['team','Seleção'],['competition','Competição/edição'],['season','Ano/temporada'],['stage','Fase alcançada'],['games','Jogos','number'],['goals','Gols','number'],['assists','Assistências','number'],['titles','Títulos','number'],['notes','Observações','textarea']])">＋ Adicionar registro</button></div>${genericTable(db.national,[['Seleção','team'],['Competição','competition'],['Ano','season'],['Fase','stage'],['J','games'],['G','goals'],['A','assists']],'editNational','Nenhum registro internacional.')}`}
function clubPage(){let map={};db.seasons.forEach(s=>{let c=s.club||'—';map[c]??={name:c,seasons:0,games:0,goals:0,assists:0,overall:[]};let x=map[c];x.seasons++;x.games+=n(s.games);x.goals+=n(s.goals);x.assists+=n(s.assists);if(n(s.overallEnd))x.overall.push(n(s.overallEnd))});let arr=Object.values(map);return `<div class="toolbar"><input id="clubSearch" placeholder="Pesquisar clube..." oninput="filterClubs()"></div><div id="clubList">${clubCards(arr)}</div>`}
function clubCards(arr){if(!arr.length)return'<div class="panel empty">Os clubes aparecerão aqui conforme você cadastrar temporadas.</div>';return `<div class="grid three">${arr.map(c=>`<section class="panel"><div class="eyebrow">CLUBE / ${c.seasons} TEMPORADAS</div><h2>${esc(c.name)}</h2><div class="record"><span>Jogos</span><strong>${c.games}</strong></div><div class="record"><span>Gols / assistências</span><strong>${c.goals} / ${c.assists}</strong></div><div class="record"><span>Overall máximo</span><strong>${c.overall.length?Math.max(...c.overall):'—'}</strong></div><div class="record"><span>Títulos</span><strong>${db.titles.filter(t=>t.team===c.name).length}</strong></div></section>`).join('')}</div>`}
function filterClubs(){let q=$('#clubSearch').value.toLowerCase(),map={};db.seasons.forEach(s=>{if(!s.club.toLowerCase().includes(q))return;let c=map[s.club]??={name:s.club,seasons:0,games:0,goals:0,assists:0,overall:[]};c.seasons++;c.games+=n(s.games);c.goals+=n(s.goals);c.assists+=n(s.assists);if(n(s.overallEnd))c.overall.push(n(s.overallEnd))});$('#clubList').innerHTML=clubCards(Object.values(map))}
function recordPage(){let s=db.seasons;let best=k=>s.length?[...s].sort((a,b)=>n(b[k])-n(a[k]))[0]:null;return `<div class="grid two"><section class="panel"><h2>Recordes por temporada</h2>${recordLine('Mais gols',best('goals'),'goals','gols')}${recordLine('Mais assistências',best('assists'),'assists','assistências')}${recordLine('Mais jogos',best('games'),'games','jogos')}${recordLine('Maior overall final',s.length?[...s].sort((a,b)=>n(b.overallEnd)-n(a.overallEnd))[0]:null,'overallEnd','overall')}</section><section class="panel"><h2>Totais da carreira</h2>${[['Jogos',totalGames()],['Gols',totalGoals()],['Assistências',totalAssists()],['G+A',totalGoals()+totalAssists()],['Média de gols/jogo',totalGames()?(totalGoals()/totalGames()).toFixed(2):'0.00'],['Média de assist./jogo',totalGames()?(totalAssists()/totalGames()).toFixed(2):'0.00']].map(x=>`<div class="record"><span>${x[0]}</span><strong>${fmt(x[1])}</strong></div>`).join('')}</section></div>`}
function timelinePage(){let ev=[...db.events,...db.transfers.map(t=>({...t,title:`Transferência: ${t.from} → ${t.to}`,date:t.date||t.season,category:'Transferência'})),...db.titles.map(t=>({...t,title:t.name,date:t.season,category:'Título'})),...db.awards.map(t=>({...t,title:t.name,date:t.season,category:'Premiação'}))].sort((a,b)=>String(a.date).localeCompare(String(b.date)));return `<div class="toolbar"><button class="btn primary" onclick="simpleForm('events','Acontecimento',[['date','Data ou temporada'],['title','Título'],['category','Categoria','select','Estreia|Recorde|Lesão|Seleção|Conquista|Outro'],['description','Descrição','textarea']])">＋ Adicionar acontecimento</button></div><section class="panel"><div class="timeline">${ev.length?ev.map(e=>`<div class="event"><small>${esc(e.date||'Data não informada')} · ${esc(e.category||'Acontecimento')}</small><strong>${esc(e.title||e.name)}</strong><div class="sub">${esc(e.description||e.notes||'')}</div></div>`).join(''):'<div class="empty">A linha do tempo será construída com seus registros.</div>'}</div></section>`}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}
function inputField(key,label,type='text',opts=''){let el=type==='textarea'?`<textarea name="${key}"></textarea>`:type==='select'?`<select name="${key}">${opts.split('|').map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" ${type==='number'?'step="any"':''}>`;return `<div class="field"><label>${label}</label>${el}</div>`}
function simpleForm(collection,title,fields,id=null){let item=id?db[collection].find(x=>x.id===id)||{}:{};openModal(title,`<form id="dataForm"><div class="formgrid">${fields.map(f=>`<div class="${f[2]==='textarea'?'wide':''}">${inputField(f[0],f[1],f[2]||'text',f[3]||'')}</div>`).join('')}</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar registro</button></div></form>`);let form=$('#dataForm');fields.forEach(f=>{if(item[f[0]]!==undefined)form.elements[f[0]].value=item[f[0]]});form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));if(id)Object.assign(item,o);else db[collection].push({id:crypto.randomUUID(),...o});closeModal();save()}}
function seasonForm(id=null){let s=id?db.seasons.find(x=>x.id===id):{};let fields=[['name','Temporada'],['age','Idade','number'],['club','Clube'],['overallStart','Overall inicial','number'],['overallEnd','Overall final','number'],['games','Jogos','number'],['goals','Gols','number'],['assists','Assistências','number'],['minutes','Minutos','number'],['yellow','Cartões amarelos','number'],['red','Cartões vermelhos','number'],['injuries','Lesões / ausências'],['notes','Observações','textarea']];openModal(id?'Editar temporada':'Adicionar temporada',`<form id="seasonForm"><div class="formgrid">${fields.map(f=>`<div class="${f[2]==='textarea'?'wide':''}">${inputField(f[0],f[1],f[2]||'text')}</div>`).join('')}</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button>${id?`<button type="button" class="btn danger" onclick="deleteSeason('${id}')">Excluir</button>`:''}<button class="btn primary">Salvar temporada</button></div></form>`);let form=$('#seasonForm');fields.forEach(f=>{if(s[f[0]]!==undefined)form.elements[f[0]].value=s[f[0]]});form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));if(id)Object.assign(s,o);else db.seasons.push({id:crypto.randomUUID(),...o});closeModal();save()}}
function editSeason(id){seasonForm(id)}function deleteSeason(id){if(confirm('Excluir esta temporada?')){db.seasons=db.seasons.filter(x=>x.id!==id);closeModal();save()}}
function quickAdd(){openModal('Novo registro','<div class="grid two">'+[['Temporada','seasonForm()'],['Competição',"competitionPage();closeModal()"],['Título',"setPage('titles');closeModal()"],['Premiação',"setPage('awards');closeModal()"],['Transferência',"setPage('transfers');closeModal()"],['Acontecimento',"setPage('timeline');closeModal()"]].map(x=>`<button class="btn" onclick="${x[1]}">${x[0]} ＋</button>`).join('')+'</div>')}
function openProfile(){let p=db.profile;let fields=[['name','Nome completo'],['nationality','Nacionalidade'],['birth','Data de nascimento','date'],['position','Posição'],['foot','Pé dominante'],['number','Número da camisa'],['club','Clube atual'],['overall','Overall','number'],['height','Altura'],['avatar','Iniciais / avatar']];openModal('Perfil do jogador',`<form id="profileForm"><div class="formgrid">${fields.map(f=>`<div>${inputField(f[0],f[1],f[2]||'text')}</div>`).join('')}</div><button class="btn primary">Salvar perfil</button></form>`);let form=$('#profileForm');fields.forEach(f=>form.elements[f[0]].value=p[f[0]]||'');form.onsubmit=e=>{e.preventDefault();db.profile=Object.fromEntries(new FormData(form));closeModal();save()}}
function editCompetition(id){simpleForm('competitions','Editar competição',[['name','Nome'],['season','Temporada'],['country','País/continente'],['type','Tipo'],['team','Clube/seleção'],['games','Jogos','number'],['goals','Gols','number'],['assists','Assistências','number'],['finish','Colocação final'],['notes','Observações','textarea']],id)}
function editTitle(id){simpleForm('titles','Editar título',[['name','Nome'],['season','Temporada'],['team','Clube/seleção'],['competition','Competição'],['category','Categoria'],['quantity','Quantidade','number'],['notes','Observações','textarea']],id)}
function editAward(id){simpleForm('awards','Editar premiação',[['name','Nome'],['season','Temporada'],['entity','Entidade'],['notes','Observações','textarea']],id)}
function editTransfer(id){simpleForm('transfers','Editar transferência',[['from','Origem'],['to','Destino'],['season','Temporada'],['age','Idade','number'],['value','Valor'],['overall','Overall','number'],['type','Tipo'],['notes','Observações','textarea']],id)}
function editNational(id){simpleForm('national','Editar registro',[['team','Seleção'],['competition','Competição'],['season','Ano'],['stage','Fase'],['games','Jogos','number'],['goals','Gols','number'],['assists','Assistências','number'],['titles','Títulos','number'],['notes','Observações','textarea']],id)}
function removeItem(fn,id){if(!confirm('Excluir este registro?'))return;let col={editCompetition:'competitions',editTitle:'titles',editAward:'awards',editTransfer:'transfers',editNational:'national'}[fn];db[col]=db[col].filter(x=>x.id!==id);save()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='careerlog-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.profile||!Array.isArray(x.seasons))throw 0;db={...structuredClone(blank),...x};save();toast('Backup importado')}catch(e){alert('Arquivo JSON inválido ou incompatível.')}};r.readAsText(f)}
// Backup controls are exposed in the header context menu via keyboard shortcut and footer panel.
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const oldRender=render;
render=function(){oldRender();if(page==='overview'||page==='stats'){};let tools=document.getElementById('dataTools');if(!tools){let d=document.createElement('div');d.id='dataTools';d.className='section-head';d.innerHTML='<div><h2>Dados e backup</h2><p>Seus registros ficam salvos localmente neste navegador.</p></div><div class="actions"><button class="btn" onclick="exportData()">Exportar JSON</button><button class="btn" onclick="exportCSV()">Exportar CSV</button><label class="btn">Importar JSON<input type="file" accept=".json,application/json" onchange="importData(this)" style="display:none"></label></div>';$('#content').appendChild(d)}};
function exportCSV(){let rows=[['temporada','idade','clube','jogos','gols','assistencias','overall_inicial','overall_final'],...db.seasons.map(s=>[s.name,s.age,s.club,s.games,s.goals,s.assists,s.overallStart,s.overallEnd])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='careerlog-temporadas.csv';a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
